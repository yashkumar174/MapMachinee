version: '3.8'

services:
  # The unified Next.js Dashboard + Python Playwright Scraper
  dashboard:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Map the desktop's prisma folder into the container to persist the dev.db SQLite file
      - ./dashboard/prisma:/app/dashboard/prisma
    environment:
      - IS_DOCKER=true
      - DATABASE_URL="file:./dev.db"
    restart: unless-stopped

  # The Standalone Express CRM Backend
  crm:
    build:
      context: ./crm/crm
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://crmuser:crmpass@postgres:5432/crmdb
      - PORT=5000
    depends_on:
      - postgres
    restart: unless-stopped

  # The Background PostgreSQL instance for the CRM
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crmuser
      POSTGRES_PASSWORD: crmpass
      POSTGRES_DB: crmdb
    ports:
      - "5432:5432"
    volumes:
      # Map local volume named pgdata into the container's storage
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  # A named docker volume ensuring database data persists even if the container is deleted
  pgdata:
